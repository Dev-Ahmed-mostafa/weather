<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>يومي | قائمة المهام</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

		:root {
			--ink: #edf5f3;
			--muted: #94aaa8;
			--paper: #101b1d;
			--panel: rgba(24, 39, 41, .92);
			--line: #2d4445;
			--teal: #39b8a8;
			--teal-dark: #8be1d5;
			--coral: #f29478;
			--shadow: 0 20px 60px rgba(0, 0, 0, .35);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			color: var(--ink);
			font-family: 'Cairo', Tahoma, sans-serif;
			background: var(--paper);
			background-image: radial-gradient(circle at 8% 12%, rgba(242, 148, 120, .13) 0 12%, transparent 34%), radial-gradient(circle at 92% 88%, rgba(57, 184, 168, .12) 0 14%, transparent 35%);
		}

		main { width: min(100% - 32px, 880px); margin: 0 auto; padding: 58px 0 48px; }
		.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 30px; }
		.eyebrow { color: var(--coral); font-size: .82rem; font-weight: 800; letter-spacing: .06em; margin: 0 0 5px; }
		h1 { font-size: clamp(2.1rem, 6vw, 3.6rem); line-height: 1.1; margin: 0; letter-spacing: -.06em; }
		.date { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }
		.mark { color: var(--teal); font-size: 2.6rem; line-height: 1; }

		.app { background: var(--panel); border: 1px solid #385253; border-radius: 24px; box-shadow: var(--shadow); backdrop-filter: blur(10px); overflow: hidden; }
		.composer { display: flex; gap: 12px; padding: 22px; border-bottom: 1px solid var(--line); }
		.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--ink); background: #142729; font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
		.composer input::placeholder { color: #6f8987; }
		.composer input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(57, 184, 168, .14); }
		button { border: 0; cursor: pointer; font: inherit; transition: transform .2s, background .2s, color .2s; }
		button:active { transform: scale(.97); }
		.add-btn { padding: 0 22px; border-radius: 12px; color: #092522; background: var(--teal); font-weight: 700; white-space: nowrap; }
		.add-btn:hover { background: #62d0c1; }

		.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 22px; background: rgba(14, 28, 30, .72); }
		.filters { display: flex; gap: 5px; flex-wrap: wrap; }
		.filter { padding: 7px 13px; border-radius: 9px; color: var(--muted); background: transparent; font-size: .86rem; }
		.filter:hover, .filter.active { color: var(--teal-dark); background: #1d4848; font-weight: 700; }
		.clear { color: var(--muted); background: transparent; font-size: .8rem; }
		.clear:hover { color: var(--coral); }

		.tasks { list-style: none; margin: 0; padding: 4px 22px 18px;  }
		.task { display: flex; align-items: center; gap: 13px; padding: 15px 0;  animation: rise .28s ease both; border: 2px solid #ccc; border-radius: 10px; margin-bottom: 10px; margin: 5px; height: 60px; }
		.task:last-child { border-bottom: 0; }
		.check { width: 21px; height: 21px; flex: 0 0 21px; border: 2px solid #557170; border-radius: 50%; background: transparent; display: grid; place-items: center; color: #092522; }
		.check:hover { border-color: var(--teal); }
		.task.done .check { border-color: var(--teal); background: var(--teal); }
		.check::after { content: '✓'; font-size: .75rem; opacity: 0; }
		.task.done .check::after { opacity: 1; }
		.task-text { flex: 1; min-width: 0; font-size: .96rem; overflow-wrap: anywhere; }
		.task.done .task-text { color: #708886; text-decoration: line-through; }
		.task-actions { display: flex; gap: 3px; opacity: 0; transition: opacity .2s; }
		.task:hover .task-actions, .task:focus-within .task-actions { opacity: 1; }
		.icon-btn { width: 32px; height: 32px; border-radius: 8px; color: var(--muted); background: transparent; font-size: 1.05rem; }
		.icon-btn:hover { color: var(--teal-dark); background: #1d4848; }
		.icon-btn.delete:hover { color: #ffab94; background: #4a2929; }
		.edit-input { width: 100%; border: 1px solid var(--teal); border-radius: 7px; padding: 6px 9px; color: var(--ink); background: #142729; font: inherit; outline: none; }
		.empty { padding: 42px 20px 48px; color: var(--muted); text-align: center; }
		.empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }
		.empty span { font-size: .85rem; }
		.footer { display: flex; justify-content: space-between; gap: 14px; padding: 18px 22px; color: var(--muted); border-top: 1px solid var(--line); font-size: .82rem; }

		@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
		@media (max-width: 540px) {
			main { width: min(100% - 20px, 880px); padding-top: 34px; }
			.topbar { margin-bottom: 22px; }
			.composer { padding: 15px; }
			.add-btn { padding: 0 15px; }
			.toolbar { align-items: flex-start; flex-direction: column; padding: 14px 15px; }
			.tasks { padding-inline: 15px; }
			.task-actions { opacity: 1; }
			.footer { padding-inline: 15px; }
		}
	</style>
</head>
<body>
	<main>
		<header class="topbar">
			<div>
				<p class="eyebrow">مساحة هادئة للإنجاز</p>
				<h1>قائمة اليوم<span class="mark">.</span></h1>
				<p class="date" id="today"></p>
			</div>
		</header>

		<section class="app" aria-label="تطبيق قائمة المهام">
			<form class="composer" id="task-form">
				<input id="task-input" type="text" maxlength="120" autocomplete="off" placeholder="ما الذي تريد إنجازه؟" aria-label="مهمة جديدة">
				<button class="add-btn" type="submit">إضافة مهمة</button>
			</form>

			<div class="toolbar">
				<div class="filters" role="group" aria-label="تصفية المهام">
					<button class="filter active" type="button" data-filter="all">الكل</button>
					<button class="filter" type="button" data-filter="active">قيد التنفيذ</button>
					<button class="filter" type="button" data-filter="done">مكتملة</button>
				</div>
				<button class="clear" id="clear-done" type="button">مسح المكتمل</button>
			</div>

			<ul class="tasks" id="task-list"></ul>
			<div class="empty" id="empty-state" hidden><strong>كل شيء هادئ هنا</strong><span>أضف أول مهمة وابدأ يومك بخطوة صغيرة.</span></div>
			<footer class="footer"><span id="count">لا توجد مهام</span><span>يتم الحفظ تلقائياً</span></footer>
		</section>
	</main>

	<script>
		const storageKey = 'yomy-tasks';
		let tasks = JSON.parse(localStorage.getItem(storageKey) || '[]');
		let currentFilter = 'all';
		const list = document.querySelector('#task-list');
		const emptyState = document.querySelector('#empty-state');
		const count = document.querySelector('#count');

		document.querySelector('#today').textContent = new Intl.DateTimeFormat('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(new Date());

		function save() { localStorage.setItem(storageKey, JSON.stringify(tasks)); }

		function render() {
			const visible = tasks.filter(task => currentFilter === 'all' || (currentFilter === 'done' ? task.done : !task.done));
			list.innerHTML = visible.map(task => `
				<li class="task ${task.done ? 'done' : ''}" data-id="${task.id}">
					<button class="check" type="button" aria-label="${task.done ? 'إلغاء إكمال المهمة' : 'إكمال المهمة'}"></button>
					<span class="task-text">${escapeHtml(task.text)}</span>
					<span class="task-actions">
						<button class="icon-btn edit" type="button" aria-label="تعديل المهمة">✎</button>
						<button class="icon-btn delete" type="button" aria-label="حذف المهمة">×</button>
					</span>
				</li>`).join('');
			emptyState.hidden = visible.length > 0;
			const remaining = tasks.filter(task => !task.done).length;
			count.textContent = remaining === 0 ? 'لا توجد مهام قيد التنفيذ' : `${remaining} ${remaining === 1 ? 'مهمة متبقية' : 'مهام متبقية'}`;
		}

		function escapeHtml(text) { return text.replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' })[char]); }
		function findTask(id) { return tasks.find(task => task.id === id); }

		document.querySelector('#task-form').addEventListener('submit', event => {
			event.preventDefault();
			const input = document.querySelector('#task-input');
			const text = input.value.trim();
			if (!text) return input.focus();
			tasks.unshift({ id: Date.now().toString(), text, done: false });
			input.value = ''; save(); render(); input.focus();
		});

		list.addEventListener('click', event => {
			const item = event.target.closest('.task');
			if (!item) return;
			const task = findTask(item.dataset.id);
			if (event.target.closest('.check')) task.done = !task.done;
			if (event.target.closest('.delete')) tasks = tasks.filter(entry => entry.id !== task.id);
			if (event.target.closest('.edit')) {
				const text = item.querySelector('.task-text');
				const input = document.createElement('input');
				input.className = 'edit-input'; input.value = task.text; input.maxLength = 120;
				text.replaceWith(input); input.focus();
				const finish = () => { task.text = input.value.trim() || task.text; save(); render(); };
				input.addEventListener('keydown', e => { if (e.key === 'Enter') finish(); if (e.key === 'Escape') render(); });
				input.addEventListener('blur', finish); return;
			}
			save(); render();
		});

		document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
			currentFilter = button.dataset.filter;
			document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
			render();
		}));
		document.querySelector('#clear-done').addEventListener('click', () => { tasks = tasks.filter(task => !task.done); save(); render(); });
		render();
	</script>
</body>
</html>
