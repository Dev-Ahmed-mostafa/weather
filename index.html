<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app beta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&display=swap" rel="stylesheet">
    <style>
        body,
        html {
            font-family: "cairo", tahoma, sans-serif;
            width: 100%;
            height: 100%;
            overflow: hidden;
            min-height: 100dvh;
            background-color: #4cc4ff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        * {box-sizing: border-box; font-family: inherit;}
        header {
            border-radius: 30px;
            width: 90%;
            min-width: 250px;
            height: 60px;
            background-color: #b7e7ff;
            display: flex;
            justify-content: center;
            margin: 0 auto;
        }
        nav {margin: auto;}
        nav a {
            margin-inline: 10px;
            text-decoration: none;
            color: #000;
            transition: all .2s ease;
        }
        nav a:hover {color: rgb(0, 0, 255);}
        .langs {
            position: absolute;
            left: 85%;
        }
        .langs .langs-btn {
            display: none;
            width: 150px;
            height: 80px;
            background: #55321b;
            border-radius: 10px;
             flex-direction: column;
            justify-content: center;
        }
        .langs-btn button {
            background: none;
            border: none;
            font-size: 14px;
            color: #fff;
            transition: all .3s ease;
            cursor: pointer;
        }
        .langs-btn button:hover {
            background-color: #854e2a;
        }
        .langs:hover  .langs-btn {
            display: flex;
        }
        .add-place {
            width: 300px;
            aspect-ratio: 1/1;
            margin: auto;
            text-align: center;
            display: none;
        }
        .add-place input {
            width: 100%;
        }
        .add-place label {
            user-select: none;
        }
        .add-place button {
            width: 100%;
            height: 30px;
            font-size: 14px;
            background-color: #0077ff;
            color: #fff;
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }
        .add-place .use-device-place {
            margin: 10px;
        }
        .main-page {
            display: flex;
            align-items: center;
            height: 70dvh;
        }
        .summary {
            width: 40%;
            min-width: 250px;
            height: 40%;
            min-height: 250px;
            margin-right: auto;
            margin-left: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #b7e7ffc7;
            border-radius: 30px;
            gap: 10px;
        }
        .content {
            position: absolute;
            height:70dvh;
            margin-right: 50px;
            font-weight: 1000;
        }
        .summary .main {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 20px;
        }
        footer {
            width: 100%;
            background-color: #ccc;
            margin-top: auto;
            position: relative;
            top: -8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="#">من نحن</a>
            <a href="#">تواصل معنا</a>
            <a href="#">المدونة</a>
        </nav>
        <div class="langs">
            <p>اللغة</p>
            <div class="langs-btn">
                <button>English</button>
                <button>عربي</button>
            </div>
        </div>
    </header>
    <main>
        <div class="add-place">
            <h2>اكتب اسم المدينة</h2>
            <input type="text" id="city">
            <div class="use-device-place" style="display: inline-flex;">
                <input type="checkbox" id="on-device" style="width: 16px;margin-right: 10px;">
                <label for="on-device">او استخدام الموقع الجغرافي للجهاز</label>
            </div>
            <button>ارسال</button>
        </div>
        <div class="main-page">
            <div class="summary">
                <div class="main">
                    <h2 id="place" style="margin: 20px; font-size: 40px;">قنا</h2>
                    <h2 id="temp-place" style="margin: 20px; font-size: 40px;">41 درجة مئوية</h2>
                </div>
                <h3 id="real-feelp-place" style="margin-inline: 40px; font-size: 24px;">يبدو وكأنها: 41 درجة مئوية</h3>
            </div>
            <div class="content">
                <h2 id="address">قنا - مصر</h2>
                <p id="temp"></p>
                <p id="desc"></p>
                <p id="feels-like"></p>
                <p id="humidity"></p>
                <p id="wind-speed"></p>
            </div>
        </div>
    </main>
    <footer>
        <p>حقوق النشر لسنة - &copy; 2025 - 2026 كل الحقوق محفوظة لاحمد</p>
    </footer>
</body>

</html>
